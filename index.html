

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>APHORIS</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>

    


    <main>
        

<section class="home">

    <div class="logo-wrap">
        <img
            class="logo"
            src="static/img/logo.png"
            alt="APHORIS"
        >

        <div class="logo-hit-area">
            <button
                type="button"
                class="admin-hotspot"
                onclick="controllaAccesso(event)"
                aria-label="Area riservata"
                tabindex="-1"
            ></button>

            
        </div>
    </div>

    <article
        class="aforisma-card"
        style="position:relative;"
    >

        

        <p class="etichetta">
            Aforisma del 30 luglio 2026
        </p>

        <div
            class="modifica-perla-hotspot"
            onclick="apriModificaPerla(event)"
            title=""
        >
            <div style="position:relative;">
                <blockquote style="white-space:pre-line;text-align:center;">
                    “Ho trovato Dio nelle pozzanghere d’acqua, nel profumo del caprifoglio, nella purezza di certi libri e persino in certi atei. Non l’ho quasi mai trovato presso coloro il cui mestiere consiste nel parlarne.”
                </blockquote>
            </div>

            <p class="autore">Christian Bobin</p>
        </div>

        

        
        <section
            class="ricorrenza"
            aria-label="Auguri Pesciolino"
            style="
                margin:34px auto 10px;
                padding-top:28px;
                border-top:1px solid rgba(200,160,90,.55);
                text-align:center;
            "
        >
            
            <p
                style="
                    max-width:760px;
                    margin:0 auto 22px;
                    color:#10296B;
                    font-size:1.35rem;
                    line-height:1.55;
                "
            >
                Auguri Pesciolino. Papà e Mamma
            </p>
            

            
            <img
                src="static/img/auguri_pesciolino.png"
                alt="Auguri Pesciolino da Papà e Mamma"
                style="
                    display:block;
                    width:100%;
                    max-width:760px;
                    max-height:720px;
                    object-fit:contain;
                    margin:0 auto;
                "
            >
            
        </section>
        

        <div class="azioni">

            <button
                onclick="window.location.href='/regala/41';"
            >
                Regala
            </button>

            <button onclick="apriCondivisione()">
                Condividi
            </button>
        </div>

        

    </div>

</section>

<script>

function apriModificaPerla(event) {

    if (!event.ctrlKey) {
        return;
    }

    event.preventDefault();
    event.stopPropagation();

    window.location.href = "/admin/perla-del-giorno";

}


function condividiWhatsApp() {

    const testo = document.querySelector(
        "#finestra-condivisione textarea"
    ).value;

    const url = "https://wa.me/?text=" + encodeURIComponent(testo);

    window.open(url, "_blank");
}

function condividiTelegram() {

    const testo = document.querySelector(
        "#finestra-condivisione textarea"
    ).value;

    window.open(
        "https://t.me/share/url?text=" +
        encodeURIComponent(testo),
        "_blank"
    );

}

function condividiFacebook() {

    window.open(
        "https://www.facebook.com/sharer/sharer.php?u=" +
        encodeURIComponent(window.location.href),
        "_blank"
    );

}

function condividiX() {

    const testo = document.querySelector(
        "#finestra-condivisione textarea"
    ).value;

    window.open(
        "https://twitter.com/intent/tweet?text=" +
        encodeURIComponent(testo),
        "_blank"
    );

}

function condividiEmail() {

    const testo = document.querySelector(
        "#finestra-condivisione textarea"
    ).value;

    window.location =
        "mailto:?subject=Una Perla di APHORIS&body=" +
        encodeURIComponent(testo);

}

function apriCondivisione() {

    document.getElementById(
        "finestra-condivisione"
    ).style.display = "block";

}

function chiudiCondivisione() {

    document.getElementById(
        "finestra-condivisione"
    ).style.display = "none";

}

</script>


    </main>

</body>
</html>
