

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>APHORIS</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>

    


    <main>
        

<section class="home">

    <div class="logo-wrap">
        <img
            class="logo"
            src="static/img/logo.png"
            alt="APHORIS"
        >

        <div class="logo-hit-area">
            <button
                type="button"
                class="admin-hotspot"
                onclick="controllaAccesso(event)"
                aria-label="Area riservata"
                tabindex="-1"
            ></button>

            
        </div>
    </div>

    <article
        class="aforisma-card"
        style="position:relative;"
    >

        

        <p class="etichetta">
            Aforisma del 1 agosto 2026
        </p>

        <div
            class="modifica-perla-hotspot"
            onclick="apriModificaPerla(event)"
            title=""
        >
            <div style="position:relative;">
                <blockquote style="white-space:pre-line;text-align:center;">
                    “Forse non siete responsabili per la situazione in cui vi trovate, ma lo diventerete se non fate nulla per cambiarla.”
                </blockquote>
            </div>

            <p class="autore">Martin Luther King</p>
        </div>

        

        

        <div class="azioni">

            <button
                onclick="window.location.href='/regala/43';"
            >
                Regala
            </button>

            <button onclick="apriCondivisione()">
                Condividi
            </button>
        </div>

        

    </div>

</section>

<script>

function apriModificaPerla(event) {

    if (!event.ctrlKey) {
        return;
    }

    event.preventDefault();
    event.stopPropagation();

    window.location.href =
        "http://127.0.0.1:5000/admin/perla-del-giorno";

}


function condividiWhatsApp() {

    const testo = document.querySelector(
        "#finestra-condivisione textarea"
    ).value;

    const url = "https://wa.me/?text=" + encodeURIComponent(testo);

    window.open(url, "_blank");
}

function condividiTelegram() {

    const testo = document.querySelector(
        "#finestra-condivisione textarea"
    ).value;

    window.open(
        "https://t.me/share/url?text=" +
        encodeURIComponent(testo),
        "_blank"
    );

}

function condividiFacebook() {

    window.open(
        "https://www.facebook.com/sharer/sharer.php?u=" +
        encodeURIComponent(window.location.href),
        "_blank"
    );

}

function condividiX() {

    const testo = document.querySelector(
        "#finestra-condivisione textarea"
    ).value;

    window.open(
        "https://twitter.com/intent/tweet?text=" +
        encodeURIComponent(testo),
        "_blank"
    );

}

function condividiEmail() {

    const testo = document.querySelector(
        "#finestra-condivisione textarea"
    ).value;

    window.location =
        "mailto:?subject=Una Perla di APHORIS&body=" +
        encodeURIComponent(testo);

}

function apriCondivisione() {

    document.getElementById(
        "finestra-condivisione"
    ).style.display = "block";

}

function chiudiCondivisione() {

    document.getElementById(
        "finestra-condivisione"
    ).style.display = "none";

}

</script>


    </main>

</body>
</html>
