

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>APHORIS</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>

    


    <main>
        

<section class="home">

    <div class="logo-wrap">
        <img
            class="logo"
            src="static/img/logo.png"
            alt="APHORIS"
        >

        <div class="logo-hit-area">
            <button
                type="button"
                class="admin-hotspot"
                onclick="controllaAccesso(event)"
                aria-label="Area riservata"
                tabindex="-1"
            ></button>

            
        </div>
    </div>

    <article
        class="aforisma-card"
        style="position:relative;"
    >

        

        <p class="etichetta">
            Aforisma del 10 agosto 2026
        </p>

        <div
            class="modifica-perla-hotspot"
            onclick="apriModificaPerla(event)"
            title=""
        >
            <div style="position:relative;">
                <blockquote style="white-space:pre-line;text-align:center;">
                    “È dolce, quando i venti sconvolgono la distesa nell’ampio mare, guardare dalla riva il faticoso travaglio di un altro; non perché sia fonte di gioia o di piacere il fatto che uno sia afflitto, ma perché è bello vedere da quali mali tu sia libero.”
                </blockquote>
            </div>

            <p class="autore">Plutarco</p>
        </div>

        

        

        <div class="azioni">

            <button
                onclick="window.location.href='/regala/53';"
            >
                Regala
            </button>
</div>

        <div
            id="messaggio-mi-piace"
            style="
                display:none;
                position:absolute;
                left:80px;
                bottom:40px;
                z-index:999;
                pointer-events:none;
            "
        >
            <img
                src="static/img/emoji_grazie.png"
                style="
                    width:300px;
                    height:auto;
                "
                alt=""
            >
        </div>

    </article>

    </section>

<script>

function apriModificaPerla(event) {

    if (!event.ctrlKey) {
        return;
    }

    event.preventDefault();
    event.stopPropagation();

    window.location.href = "/admin/perla-del-giorno";

}


</script>


    </main>

</body>
</html>
